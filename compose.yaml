# synology-site-hub. Put this file and your .env (from .env.example) in one folder, then:
#   sudo docker compose up -d          update later: sudo docker compose pull && sudo docker compose up -d --remove-orphans
name: site-hub
services:
  router:
    image: ghcr.io/raulsimpetru/synology-site-hub:${HUB_VERSION:-latest}
    ports: ["${HUB_PORT:-4300}:8080"]
    environment:
      HUB_URL: ${HUB_URL:-}
      HUB_ORG: ${HUB_ORG:-}
      HUB_PASSWORD: ${HUB_PASSWORD:-}
      OIDC_ISSUER: ${OIDC_ISSUER:-}
      OIDC_CLIENT_ID: ${OIDC_CLIENT_ID:-}
      OIDC_CLIENT_SECRET: ${OIDC_CLIENT_SECRET:-}
      SESSION_SECRET: ${SESSION_SECRET:-}
      # GitLab OAuth app (scope api, redirect <hub>/_hub/gitlab) for the Remove button; unset = no Remove.
      GITLAB_URL: ${GITLAB_URL:-}
      GITLAB_CLIENT_ID: ${GITLAB_CLIENT_ID:-}
      GITLAB_CLIENT_SECRET: ${GITLAB_CLIENT_SECRET:-}
      HOOK_SECRET: ${HOOK_SECRET:-}
      DOCKER_API: http://docker:2375
    # DSM's default certificate (root-only files, so run as uid 0 but with no capabilities).
    volumes: ["${CERT_DIR:-/usr/syno/etc/certificate/system/default}:/certs:ro"]
    user: "0"
    cap_drop: [ALL]
    networks: [sites, internal]
    restart: unless-stopped

  # Read-only window onto Docker: the router may list containers and read their logs, nothing else.
  docker:
    image: tecnativa/docker-socket-proxy:0.3
    environment: { CONTAINERS: 1 }
    volumes: ["/var/run/docker.sock:/var/run/docker.sock:ro"]
    networks: [internal]
    restart: unless-stopped

  # Builds each pushed branch's Dockerfile and runs it as a site. GitLab's push hook reaches it only
  # through the hub (/_hub/hook, checked against HOOK_SECRET); it is the one service with the Docker socket.
  builder:
    image: ghcr.io/raulsimpetru/synology-site-hub:${HUB_VERSION:-latest}
    command: ["bun", "builder.ts"]
    environment:
      GITLAB_URL: ${GITLAB_URL:-}
      GITLAB_TOKEN: ${GITLAB_TOKEN:-}
      HOOK_SECRET: ${HOOK_SECRET:-}
    volumes: ["/var/run/docker.sock:/var/run/docker.sock"]
    user: "0"
    networks: [internal, egress]
    restart: unless-stopped

networks:
  sites: { name: sites }          # the builder attaches every site container here
  internal: { internal: true }   # hub ↔ Docker API proxy ↔ builder; sites can't reach it
  egress: {}                      # the builder's way out to GitLab and image registries
